<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Macro Monitor</title>
  <style>
    :root { --bg:#f7f5f0; --paper:#fff; --ink:#14202b; --muted:#5a6675; --line:#e3dfd4; --accent:#8a1c2b; --accent-soft:#f3e5e7; --tag-geo:#3b5a82; --tag-mkt:#1f6f4a; --tag-cb:#7a4b1a; --tag-res:#5a3a8a; --tag-opi:#8a1c2b; --tag-soc:#444; font-family:ui-serif,Georgia,"Times New Roman",serif; }
    *{box-sizing:border-box} html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5}
    a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
    .wrap{max-width:1200px;margin:0 auto;padding:0 24px}
    .topbar{background:var(--paper);border-bottom:1px solid var(--line);padding:18px 0}
    .topbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap}
    .brand{display:flex;align-items:center;gap:14px}
    .brand-mark{width:52px;height:52px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:ui-sans-serif,system-ui,sans-serif;font-weight:700}
    .brand h1{margin:0;font-size:22px} .brand .sub{color:var(--muted);font-size:13px;font-family:ui-sans-serif,system-ui,sans-serif}
    .meta{color:var(--muted);font-size:13px;font-family:ui-sans-serif,system-ui,sans-serif;text-align:right}
    .filters{display:flex;align-items:center;gap:16px;padding:16px 24px;flex-wrap:wrap}
    .tabs{display:flex;flex-wrap:wrap;gap:6px}
    .tab{font-family:ui-sans-serif,system-ui,sans-serif;font-size:13px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--paper);cursor:pointer;color:var(--ink)}
    .tab.active{background:var(--ink);color:#fff;border-color:var(--ink)}
    .tab .count{opacity:.65;margin-left:6px;font-variant-numeric:tabular-nums}
    .search-wrap{display:flex;gap:8px;margin-left:auto}
    #q,#lang{font-family:ui-sans-serif,system-ui,sans-serif;font-size:14px;padding:8px 12px;border:1px solid var(--line);background:var(--paper);border-radius:8px}
    #q{min-width:280px}
    main.wrap{display:grid;grid-template-columns:1fr 320px;gap:32px;padding-top:16px;padding-bottom:40px}
    @media (max-width:720px){main.wrap{grid-template-columns:1fr}.side{order:2}}
    .list .item{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:14px}
    .item h2{font-size:18px;margin:0 0 6px;line-height:1.3} .item h2 a{color:var(--ink)} .item h2 a:hover{color:var(--accent)}
    .item .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:12px;font-family:ui-sans-serif,system-ui,sans-serif;margin-bottom:6px}
    .item .src{color:var(--ink);font-weight:600}
    .tag{display:inline-block;font-size:11px;font-family:ui-sans-serif,system-ui,sans-serif;padding:2px 8px;border-radius:999px;color:#fff}
    .tag.geopolitiek{background:var(--tag-geo)}.tag.markten{background:var(--tag-mkt)}.tag.centrale-banken{background:var(--tag-cb)}
    .tag.research{background:var(--tag-res)}.tag.opinie{background:var(--tag-opi)}.tag.social{background:var(--tag-soc)}
    .lang-pill{font-size:11px;padding:1px 6px;border-radius:4px;background:var(--accent-soft);color:var(--accent);font-family:ui-sans-serif,system-ui,sans-serif}
    .item p{margin:6px 0 0;color:var(--ink);font-size:14.5px}
    .side .card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
    .side h3{margin:0 0 8px;font-size:15px;font-family:ui-sans-serif,system-ui,sans-serif;letter-spacing:.3px;text-transform:uppercase;color:var(--muted)}
    .status-row{font-family:ui-sans-serif,system-ui,sans-serif;font-size:12px;display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px dotted var(--line)}
    .status-row:last-child{border-bottom:none}
    .status-row .ok{color:var(--tag-mkt)} .status-row .ko{color:var(--accent)}
    .foot{display:flex;justify-content:space-between;padding-top:18px;border-top:1px solid var(--line);font-family:ui-sans-serif,system-ui,sans-serif;font-size:12px;color:var(--muted);padding-bottom:24px}
    .empty{padding:40px;text-align:center;color:var(--muted)}
    .output-tabs{display:flex;gap:4px;margin-bottom:10px;flex-wrap:wrap}
    .out-tab{font-family:ui-sans-serif,system-ui,sans-serif;font-size:11px;padding:3px 8px;border-radius:999px;border:1px solid var(--line);background:var(--paper);cursor:pointer;color:var(--ink)}
    .out-tab.active{background:var(--ink);color:#fff;border-color:var(--ink)}
  </style>
</head>
<body>
  <header class="topbar"><div class="wrap">
    <div class="brand"><div class="brand-mark">MM</div><div>
      <h1>Macro Monitor</h1>
      <div class="sub">Peter Hoogland &middot; Northwind Capital &middot; live feed + dagelijks opiniestuk</div>
    </div></div>
    <div class="meta" id="meta">&mdash; laden &mdash;</div>
  </div></header>
  <nav class="filters wrap">
    <div class="tabs" id="tabs"></div>
    <div class="search-wrap">
      <input id="q" type="search" placeholder="Zoek in titels en samenvattingen&hellip;" autocomplete="off">
      <select id="lang"><option value="">Alle talen</option><option value="nl">NL</option><option value="fr">FR</option><option value="en">EN</option><option value="de">DE</option></select>
    </div>
  </nav>
  <main class="wrap">
    <section id="list" class="list">&mdash; laden &mdash;</section>
    <aside class="side">
      <div class="card" id="outputs-card" style="display:none">
        <h3>Outputs</h3>
        <div class="output-tabs" id="output-tabs"></div>
        <div id="output-content"></div>
      </div>
      <div class="card"><h3>Status bronnen</h3><div id="status"></div></div>
    </aside>
  </main>
  <footer class="wrap foot">
    <span id="foot">Laden&hellip;</span>
    <span>GitHub Pages &middot; publiek &middot; Macro Monitor</span>
  </footer>

  <script>
    // Plain JS, geen externe modules. Werkt zelfs met extensies die scripts injecteren.
    var API = 'https://teiavtucajajkpezyolt.supabase.co/functions/v1';
    var LABELS = { all:'Alles', geopolitiek:'Geopolitiek', markten:'Markten', 'centrale-banken':'Centrale banken', research:'Research', opinie:'Opinie', social:'Onderstroom' };
    var state = { cat:'all', q:'', lang:'', data:null };
    var $ = function(id){ return document.getElementById(id); };
    var escape = function(s){ return String(s||'').replace(/[<>&"]/g,function(c){return {'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c];}); };
    var stripTags = function(s){ return String(s||'').replace(/<[^>]+>/g,' ').replace(/&[a-z#0-9]+;/gi,' ').replace(/\s+/g,' ').trim(); };
    var fmtTime = function(iso){ if(!iso)return''; var d=new Date(iso); if(isNaN(d.getTime()))return''; var diff=(Date.now()-d.getTime())/1000; if(diff<60)return'net nu'; if(diff<3600)return Math.floor(diff/60)+' min geleden'; if(diff<86400)return Math.floor(diff/3600)+' u geleden'; return d.toLocaleString('nl-BE',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}); };

    function loadFeed(){
      return fetch(API+'/api/feed').then(function(r){ if(!r.ok)throw new Error('HTTP '+r.status); return r.json(); }).then(function(d){
        state.data = d; render();
      }).catch(function(e){
        $('meta').textContent='feed niet beschikbaar ('+e.message+')';
        $('list').innerHTML='<div class="empty">Geen feed.</div>';
      });
    }
    function loadOutputs(){
      return fetch(API+'/api/outputs').then(function(r){return r.json();}).then(function(ops){
        if(!ops||!ops.latest)return;
        $('outputs-card').style.display='block';
        var kinds=[{id:'opinion',label:'Dagelijks'},{id:'weekly',label:'Weekend'},{id:'topic',label:'Topic'},{id:'social',label:'Social'}];
        var activeKind='opinion';
        function renderOne(kindId){
          var latest=ops.latest[kindId];
          if(!latest)return '<div style="font-family:ui-sans-serif,system-ui,sans-serif;font-size:13px;color:var(--muted);padding:8px 0">Nog geen output.</div>';
          var html='<div style="font-family:ui-serif,Georgia,serif;font-size:15px;font-weight:600;margin-bottom:4px">'+escape(latest.title||'')+'</div>';
          html+='<div style="font-size:12px;color:var(--muted);font-family:ui-sans-serif,system-ui,sans-serif;margin-bottom:8px">'+escape(latest.date)+' &middot; '+(latest.woorden||'?')+' w.</div>';
          html+='<div style="font-size:13px;line-height:1.45;color:var(--ink);margin-bottom:12px">'+escape(latest.preview||'')+'</div>';
          html+='<div style="display:flex;gap:8px;flex-wrap:wrap">';
          html+='<a target="_blank" href="'+API+latest.md+'" style="display:inline-block;padding:6px 12px;background:var(--paper);border:1px solid var(--line);color:var(--ink);border-radius:6px;font-family:ui-sans-serif,system-ui,sans-serif;font-size:13px;text-decoration:none">.md</a>';
          if(true){
            html+='<a href="'+API+latest.docx+'" style="display:inline-block;padding:6px 12px;background:var(--accent);color:#fff;border-radius:6px;font-family:ui-sans-serif,system-ui,sans-serif;font-size:13px;text-decoration:none">.docx</a>';
          }
          html+='</div>';
          return html;
        }
        function renderTabs(){
          var html=''; for(var i=0;i<kinds.length;i++){ var k=kinds[i]; html+='<button class="out-tab'+(activeKind===k.id?' active':'')+'" data-k="'+k.id+'">'+k.label+(ops.latest[k.id]?' &bull;':'')+'</button>'; }
          $('output-tabs').innerHTML=html;
          var btns=$('output-tabs').querySelectorAll('.out-tab');
          for(var j=0;j<btns.length;j++){ btns[j].addEventListener('click',function(){ activeKind=this.dataset.k; renderTabs(); $('output-content').innerHTML=renderOne(activeKind); }); }
        }
        renderTabs(); $('output-content').innerHTML=renderOne(activeKind);
      }).catch(function(){ });
    }
    function render(){
      var d=state.data;
      $('meta').innerHTML='<strong>'+d.totalArticles+'</strong> artikels &middot; <strong>'+d.newThisRun+'</strong> nieuw &middot; <strong>'+d.sourcesOk+'/'+d.sources+'</strong> bronnen ok &middot; '+fmtTime(d.generatedAt);
      $('foot').textContent='GitHub Pages &middot; '+d.totalArticles+' artikels uit '+d.sources+' bronnen';
      var cats=['geopolitiek','markten','centrale-banken','research','opinie','social'];
      var counts={all:d.items.length}; for(var i=0;i<cats.length;i++)counts[cats[i]]=0;
      for(var j=0;j<d.items.length;j++)counts[d.items[j].category]=(counts[d.items[j].category]||0)+1;
      var tabHtml=''; var allCats=['all'].concat(cats);
      for(var k=0;k<allCats.length;k++){ var ck=allCats[k]; tabHtml+='<button class="tab'+(state.cat===ck?' active':'')+'" data-cat="'+ck+'">'+LABELS[ck]+'<span class="count">'+(counts[ck]||0)+'</span></button>'; }
      $('tabs').innerHTML=tabHtml;
      var tBtns=$('tabs').querySelectorAll('.tab');
      for(var l=0;l<tBtns.length;l++){ tBtns[l].addEventListener('click',function(){ state.cat=this.dataset.cat; render(); }); }
      var term=state.q.toLowerCase().trim();
      var filtered=d.items.filter(function(it){
        if(state.cat!=='all'&&it.category!==state.cat)return false;
        if(state.lang&&it.lang!==state.lang)return false;
        if(term){ var hay=(it.title+' '+(it.summary||'')+' '+it.source).toLowerCase(); if(hay.indexOf(term)===-1)return false; }
        return true;
      });
      if(!filtered.length){ $('list').innerHTML='<div class="empty">Geen artikels.</div>'; return; }
      var lh=''; var limit=Math.min(filtered.length,300);
      for(var m=0;m<limit;m++){ var it=filtered[m];
        lh+='<article class="item"><div class="row"><span class="tag '+escape(it.category)+'">'+escape(LABELS[it.category]||it.category)+'</span><span class="src">'+escape(it.source)+'</span><span class="lang-pill">'+escape((it.lang||'').toUpperCase())+'</span><span>'+escape(fmtTime(it.pub_date||it.pubDate))+'</span></div>';
        lh+='<h2><a href="'+escape(it.link)+'" target="_blank" rel="noopener noreferrer">'+escape(it.title)+'</a></h2>';
        if(it.summary)lh+='<p>'+escape(stripTags(it.summary))+'</p>';
        lh+='</article>';
      }
      $('list').innerHTML=lh;
      var st=(d.sourceStatus||[]).slice().sort(function(a,b){ return (b.items||0)-(a.items||0); });
      var sh=''; for(var n=0;n<st.length;n++){ var r=st[n]; sh+='<div class="status-row"><span>'+escape(r.name)+'</span><span class="'+(r.ok?'ok':'ko')+'">'+(r.ok?r.items+' it.':(r.status?'HTTP '+r.status:'fail'))+'</span></div>'; }
      $('status').innerHTML=sh;
    }
    $('q').addEventListener('input',function(e){ state.q=e.target.value; render(); });
    $('lang').addEventListener('change',function(e){ state.lang=e.target.value; render(); });
    loadFeed();
    loadOutputs();
  </script>
</body>
</html>
